name: Flutter Mobile — Test & Build
on:
  push:
    branches: [main, feat/flutter-mobile-control-center]
    paths:
      - "apps/flutter/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    paths:
      - "apps/flutter/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Also build the iOS simulator app (optional)'
        required: false
        type: boolean
        default: false

concurrency:
  group: flutter-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-test:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android-debug-apk:
    name: Android installable debug APK (batched release only)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[mobile-release]'))
    needs: flutter-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.omiiii --project-name o_agent_mobile .
      - run: dart run tool/prepare_platforms.dart
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
      - name: Package complete Flutter source with native platform scaffolds
        run: |
          mkdir -p ../../dist
          zip -qr ../../dist/o-agent-flutter-source.zip . -x "build/*" ".dart_tool/*" "o-agent-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: o-agent-flutter-source-android-ios
          path: dist/o-agent-flutter-source.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: o-agent-flutter-android-debug-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator app (unsigned, manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios == true
    needs: flutter-test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.omiiii --project-name o_agent_mobile .
      - run: dart run tool/prepare_platforms.dart
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Package simulator application
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app o-agent-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: o-agent-flutter-ios-simulator
          path: apps/flutter/o-agent-ios-simulator.zip
          retention-days: 30
          if-no-files-found: error
