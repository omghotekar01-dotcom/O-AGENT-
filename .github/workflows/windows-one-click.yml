name: Windows One-Click Launcher
on:
  pull_request:
    paths:
      - "tools/windows/**"
      - "apps/vscode/scripts/**"
      - "apps/gateway/src/**"
      - "apps/control-plane/src/**"
      - "*.cmd"
      - ".github/workflows/windows-one-click.yml"
  push:
    branches: [main]
    paths:
      - "tools/windows/**"
      - "apps/gateway/src/**"
      - "apps/control-plane/src/**"
      - "*.cmd"
      - ".github/workflows/windows-one-click.yml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-integration:
    name: Windows PowerShell 5.1 launcher integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse one-click VS Code Windows helper without running or disclosing credentials
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'apps/vscode/scripts/read-local-worker.ps1'),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Check Windows scripts and start actual Node backend/worker twice
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows/self-test.ps1
