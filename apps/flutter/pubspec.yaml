name: o_agent_mobile
description: Native Flutter mobile mission control for O-AGENT.
publish_to: none
version: 0.15.2+19

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_appauth: ^11.0.0
  url_launcher: ^6.3.2
  file_picker: ^13.3.3
  # Bundles the Cupertino icon font used throughout the iOS-style UI.
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
